[project]
name = "red-atlas-pipeline"
version = "0.1.0"
description = "R.E.D. ATLAS - pipeline científico de datos NASA: PDS/STAC -> COG / GeoJSON / Parquet"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "rasterio>=1.4",
    "rio-cogeo>=5.3",
    "pyproj>=3.6",
    "shapely>=2.0",
    "pyarrow>=17",
    "duckdb>=1.1",
    "h3>=4.1",
    "pystac-client>=0.8",
    "requests>=2.32",
    "scipy>=1.14",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/red_atlas_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: necesita acceso a red (STAC/USGS)"]

[tool.ruff]
line-length = 100
